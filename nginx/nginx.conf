# Nginx configuration for Laravel API (Production - Non-Docker)
# Sử dụng PHP-FPM

upstream php-fpm {
    server unix:/var/run/php/php8.2-fpm.sock; # Hoặc php8.1-fpm.sock tùy version PHP
    # Hoặc sử dụng TCP: server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name api.localhost api.ship-erp.local localhost;
    
    root /home/vumoi/company_ship/ship-app-api/public;
    index index.php index.html;
    
    # Logs
    access_log /var/log/nginx/laravel-api-access.log;
    error_log /var/log/nginx/laravel-api-error.log;
    
    # Max upload size
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    # Charset
    charset utf-8;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # CORS headers (adjust as needed)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    
    # Handle preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    # Main location - Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # API routes
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI timeouts
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ /\.(env|git|svn) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to Laravel files outside public
    location ~ ^/(bootstrap|config|database|resources|routes|storage|tests|vendor|app|artisan) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Cache static assets
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Laravel storage files
    location /storage {
        alias /home/vumoi/company_ship/ship-app-api/storage/app/public;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
