services:
  app:
    build:
      context: .
      target: fpm
    container_name: ship-app-api
    restart: unless-stopped
    volumes:
      - .:/var/www
    # DB_* dưới đây được Docker inject vào PHP-FPM trước khi Laravel đọc .env.
    # Laravel (dotenv immutable): biến môi trường ĐÃ CÓ sẽ không bị ghi đè bởi file .env.
    # → Nếu chạy `php artisan migrate` TRÊN MÁY HOST với .env (vd. DB_CONNECTION=sqlite), migration
    #   có thể chạy vào SQLite, trong khi request qua container vẫn dùng MySQL ship_db → thiếu bảng.
    # Luôn migrate trong cùng môi trường với HTTP: docker compose exec app php artisan migrate
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ship_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ship-network

  db:
    image: mysql:8.0
    container_name: ship-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ship_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ship-network

  nginx:
    image: nginx:alpine
    container_name: ship-api-nginx
    restart: unless-stopped
    ports:
      - "${API_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - ship-network

networks:
  ship-network:
    driver: bridge